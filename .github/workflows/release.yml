name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  lpac:
    uses: ./.github/workflows/lpac.yml
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install zig
        run: |
          pipx install ziglang
          PIPX_BIN="$(pipx environment --value PIPX_BIN_DIR)"
          ls -l "$PIPX_BIN"
          # ziglang >= 0.16 ships the binary as python-zig; cargo-zigbuild expects zig
          if [ ! -e "$PIPX_BIN/zig" ] && [ -e "$PIPX_BIN/python-zig" ]; then
            ln -s "$PIPX_BIN/python-zig" "$PIPX_BIN/zig"
          fi
          echo "$PIPX_BIN" >> "$GITHUB_PATH"
          "$PIPX_BIN/zig" version

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build zte-agent
        run: cargo zigbuild --release --target aarch64-unknown-linux-musl -p zte-agent --locked

      - name: Sanity-check binary
        run: |
          BIN=target/aarch64-unknown-linux-musl/release/zte-agent
          file "$BIN"
          readelf -h "$BIN" | grep -E 'Class|Machine|Type'
          readelf -d "$BIN" || true
          ls -l "$BIN"

      - uses: actions/upload-artifact@v4
        with:
          name: zte-agent
          path: target/aarch64-unknown-linux-musl/release/zte-agent

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Build dashboard
        working-directory: web-app
        run: |
          npm ci
          npm run build

      - name: Package dist
        run: tar czf dashboard-dist.tar.gz -C web-app/dist .

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard-dist.tar.gz

  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install zig 0.14.1
        run: |
          # The version the screen is tested with, from the official checksummed tarball.
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
          echo '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  zig.tar.xz' | sha256sum -c -
          mkdir "$RUNNER_TEMP/zig" && tar xJf zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Build openui-screen
        run: |
          ZIG=zig sh screen/build.sh
          file build/screen/openui-screen

      - uses: actions/upload-artifact@v4
        with:
          name: openui-screen
          path: build/screen/openui-screen

  publish:
    needs: [agent, dashboard, screen, checks, lpac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets and checksums
        run: |
          mkdir assets
          cp artifacts/zte-agent/zte-agent assets/zte-agent
          cp artifacts/dashboard-dist/dashboard-dist.tar.gz assets/
          cp artifacts/lpac-linux-arm64/lpac assets/lpac
          cp artifacts/openui-screen/openui-screen assets/openui-screen
          cd assets
          sha256sum zte-agent dashboard-dist.tar.gz openui-screen lpac > sha256sums.txt
          cat sha256sums.txt

      - name: Release notes
        run: |
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            cp "docs/releases/${GITHUB_REF_NAME}.md" release-notes.md
            exit 0
          fi
          cat > release-notes.md <<'EOF'
          Pre-built artifacts for the ZTE U60 Pro (MU5250).

          **Assets**

          Install or update everything with `bash install.sh` (see docs/INSTALL.md);
          it downloads these files and checks them against `sha256sums.txt`.

          - `zte-agent` — agent binary (aarch64 musl).
          - `dashboard-dist.tar.gz` — web dashboard build.
          - `openui-screen` — touchscreen UI (aarch64, GPL-3.0-or-later; source in
            `screen/`, licenses in `screen/LICENSE`, `screen/NOTICE`).
          - `lpac` — eSIM LPA (aarch64, built from lpac v2.3.0 with the patches in
            `scripts/lpac-patches/`; AGPL-3.0/LGPL-2.1, see `licenses/lpac/`).
            Deploy with `scripts/deploy-components.py --lpac`.
          - `sha256sums.txt` — SHA-256 checksums.

          **Verify**

          ```sh
          sha256sum -c sha256sums.txt
          ```
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          ARGS=(--draft --title "$TAG" --notes-file release-notes.md --generate-notes)
          case "$TAG" in *-rc*) ARGS+=(--prerelease) ;; esac
          gh release create "$TAG" "${ARGS[@]}" assets/*
